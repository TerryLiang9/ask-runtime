services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_OPTIONAL: "false"
        INSTALL_MINERU_RUNTIME: "false"
    env_file:
      - ${EMATA_ENV_FILE:-.env.demo}
    environment:
      PYTHONPATH: /workspace/backend
      EMATA_DATABASE_URL: sqlite:////workspace/data/emata.db
      EMATA_STORAGE_BACKEND: filesystem
      EMATA_UPLOAD_BASE_DIR: /workspace/tmp/uploads
    volumes:
      - demo_data:/workspace/data
      - upload_data:/workspace/tmp/uploads
    ports:
      - "127.0.0.1:${EMATA_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  console:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_EMATA_API_BASE_URL: "${NEXT_PUBLIC_EMATA_API_BASE_URL}"
    env_file:
      - ${EMATA_ENV_FILE:-.env.demo}
    environment:
      EMATA_API_BASE_URL: http://api:8000
      NEXT_PUBLIC_EMATA_API_BASE_URL: "${NEXT_PUBLIC_EMATA_API_BASE_URL}"
    ports:
      - "127.0.0.1:${EMATA_CONSOLE_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  demo_data:
  upload_data:
