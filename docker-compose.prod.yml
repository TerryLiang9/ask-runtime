services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_OPTIONAL: "true"
        INSTALL_MINERU_RUNTIME: "${EMATA_INSTALL_MINERU_RUNTIME:-false}"
        MINERU_VERSION: "${EMATA_MINERU_DOCKER_VERSION:-3.0.1}"
        MINERU_BUILD_MODEL_SOURCE: "${EMATA_MINERU_DOCKER_MODEL_SOURCE:-modelscope}"
        MINERU_BUILD_MODEL_TYPE: "${EMATA_MINERU_DOCKER_MODEL_TYPE:-pipeline}"
        MINERU_BUILD_MODEL_TREE_SHA256: "${EMATA_MINERU_DOCKER_MODEL_TREE_SHA256:-581698f99866ec54ce3997d0636743a430ecc119d35eda330058fdc0ab10a285}"
    env_file:
      - ${EMATA_ENV_FILE:-.env.production}
    environment:
      PYTHONPATH: /workspace/backend
      EMATA_MINERU_EXECUTABLE: "${EMATA_MINERU_EXECUTABLE:-mineru}"
      MINERU_TOOLS_CONFIG_JSON: /opt/mineru-runtime/config/mineru.json
      MINERU_MODEL_SOURCE: local
      MINERU_DEVICE_MODE: cpu
      HF_HOME: /opt/mineru-runtime/cache/huggingface
      MODELSCOPE_CACHE: /opt/mineru-runtime/cache/modelscope
      XDG_CACHE_HOME: /opt/mineru-runtime/cache
    volumes:
      - upload_data:/workspace/tmp/uploads
    ports:
      - "127.0.0.1:${EMATA_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
      minio:
        condition: service_healthy
      milvus:
        condition: service_healthy

  temporal-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_OPTIONAL: "true"
        INSTALL_MINERU_RUNTIME: "${EMATA_INSTALL_MINERU_RUNTIME:-false}"
        MINERU_VERSION: "${EMATA_MINERU_DOCKER_VERSION:-3.0.1}"
        MINERU_BUILD_MODEL_SOURCE: "${EMATA_MINERU_DOCKER_MODEL_SOURCE:-modelscope}"
        MINERU_BUILD_MODEL_TYPE: "${EMATA_MINERU_DOCKER_MODEL_TYPE:-pipeline}"
        MINERU_BUILD_MODEL_TREE_SHA256: "${EMATA_MINERU_DOCKER_MODEL_TREE_SHA256:-581698f99866ec54ce3997d0636743a430ecc119d35eda330058fdc0ab10a285}"
    env_file:
      - ${EMATA_ENV_FILE:-.env.production}
    environment:
      PYTHONPATH: /workspace/backend
      EMATA_MINERU_EXECUTABLE: "${EMATA_MINERU_EXECUTABLE:-mineru}"
      MINERU_TOOLS_CONFIG_JSON: /opt/mineru-runtime/config/mineru.json
      MINERU_MODEL_SOURCE: local
      MINERU_DEVICE_MODE: cpu
      HF_HOME: /opt/mineru-runtime/cache/huggingface
      MODELSCOPE_CACHE: /opt/mineru-runtime/cache/modelscope
      XDG_CACHE_HOME: /opt/mineru-runtime/cache
    volumes:
      - upload_data:/workspace/tmp/uploads
    command: ["python", "-m", "app.temporal_worker"]
    depends_on:
      temporal:
        condition: service_started
      postgres:
        condition: service_healthy

  console:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_EMATA_API_BASE_URL: "${NEXT_PUBLIC_EMATA_API_BASE_URL}"
    env_file:
      - ${EMATA_ENV_FILE:-.env.production}
    environment:
      EMATA_API_BASE_URL: http://api:8000
      NEXT_PUBLIC_EMATA_API_BASE_URL: "${NEXT_PUBLIC_EMATA_API_BASE_URL}"
    ports:
      - "127.0.0.1:${EMATA_CONSOLE_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: "${EMATA_POSTGRES_DB:-emata}"
      POSTGRES_USER: "${EMATA_POSTGRES_USER:-emata}"
      POSTGRES_PASSWORD: "${EMATA_POSTGRES_PASSWORD:?Set EMATA_POSTGRES_PASSWORD in .env.production}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EMATA_POSTGRES_USER:-emata} -d ${EMATA_POSTGRES_DB:-emata}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.25.2
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: "${EMATA_POSTGRES_USER:-emata}"
      POSTGRES_PWD: "${EMATA_POSTGRES_PASSWORD:?Set EMATA_POSTGRES_PASSWORD in .env.production}"
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/docker.yaml
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.34.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:${EMATA_TEMPORAL_UI_PORT:-8088}:8080"
    depends_on:
      - temporal

  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    command: >
      etcd
      -advertise-client-urls=http://0.0.0.0:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${EMATA_MINIO_ACCESS_KEY:?Set EMATA_MINIO_ACCESS_KEY in .env.production}"
      MINIO_ROOT_PASSWORD: "${EMATA_MINIO_SECRET_KEY:?Set EMATA_MINIO_SECRET_KEY in .env.production}"
    ports:
      - "127.0.0.1:${EMATA_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${EMATA_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  milvus:
    image: milvusdb/milvus:v2.4.15
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: "${EMATA_MINIO_ACCESS_KEY:?Set EMATA_MINIO_ACCESS_KEY in .env.production}"
      MINIO_SECRET_ACCESS_KEY: "${EMATA_MINIO_SECRET_KEY:?Set EMATA_MINIO_SECRET_KEY in .env.production}"
      MINIO_BUCKET_NAME: "${EMATA_MILVUS_BUCKET:-a-bucket}"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9091/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.107.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/otel/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    profiles: ["observability"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    profiles: ["observability"]

  loki:
    image: grafana/loki:3.1.1
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/config.yml:ro
    ports:
      - "127.0.0.1:3100:3100"
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
      - loki
    profiles: ["observability"]

volumes:
  postgres_data:
  etcd_data:
  minio_data:
  upload_data:
